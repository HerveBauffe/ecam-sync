[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

# Patched Android BLE backend (indications), see vendor/README.md
[patch.crates-io]
tauri-plugin-blec = { path = "vendor/tauri-plugin-blec" }
